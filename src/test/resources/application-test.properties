# Test Configuration
spring.profiles.active=test

# Disable AWS services in tests
aws.enabled=false

# Disable OpenAI in tests
openai.enabled=false

# Use in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Logging
logging.level.root=WARN
logging.level.group.rxcloud.ava.aigc=DEBUG

# File upload limits for tests
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# JWT Configuration for tests
jwt.secret=testSecretKeyThatShouldBeChangedInProductionEnvironment12345678901234567890
jwt.expiration=86400000
jwt.refresh-expiration=604800000
